<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f3320" />
<title>Bell Quads — Tournament Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --felt:#1a472a; --felt-d:#0f3320; --felt-l:#236b43; --line:#2c7a4e;
  --gold:#f4d03f; --gold-d:#cda82b; --cream:#fdfaf0; --dim:#bcd3c4;
  --ink:#0a2417; --red:#e05b4a; --ok:#3ec97a;
  /* theme overridable */
  --t-panel:#0f3320; --t-accent:#f4d03f; --t-text:#fdfaf0; --t-overlay:.35;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--t-text);
  background:radial-gradient(1200px 700px at 50% -15%, #2a7d4e 0%, transparent 60%), var(--felt);
  min-height:100dvh;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
#bgveil{position:fixed;inset:0;z-index:1;background:rgba(10,36,23,var(--t-overlay));display:none}
.wrap{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column;padding:clamp(.8rem,2.5vh,2rem) clamp(1rem,3vw,3rem)}

/* ---- header ---- */
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem}
.brand .mk{width:clamp(34px,4vw,52px);aspect-ratio:1;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold-d));color:var(--ink);font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(1.1rem,2vw,1.7rem)}
.brand b{font-family:"Playfair Display",serif;font-size:clamp(1rem,1.8vw,1.6rem);line-height:1}
.brand small{display:block;font-size:clamp(.5rem,.7vw,.62rem);letter-spacing:.3em;color:var(--t-accent);font-weight:700}
.tname{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(1rem,2vw,1.8rem);color:var(--t-accent);text-align:right;line-height:1.1}
.statepill{font-size:clamp(.6rem,1vw,.85rem);letter-spacing:.15em;font-weight:700;padding:.2rem .7rem;border-radius:999px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase}
.statepill.running{color:#063;background:var(--ok);border-color:var(--ok)}
.statepill.paused{color:#fff;background:var(--red);border-color:var(--red)}
.statepill.finished{color:var(--ink);background:var(--gold);border-color:var(--gold)}

/* ---- center stage ---- */
.stage{flex:1;display:grid;grid-template-rows:auto 1fr auto;align-items:center;min-height:0}
.lvlrow{display:flex;align-items:baseline;justify-content:center;gap:1.2rem;margin-top:1vh}
.lvltag{font-size:clamp(.8rem,1.4vw,1.3rem);letter-spacing:.35em;color:var(--dim);font-weight:700;text-transform:uppercase}
.lvlnum{font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(1.4rem,3vw,2.6rem);color:var(--t-accent)}

.clock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.time{font-family:"Playfair Display",serif;font-weight:900;line-height:.9;
  font-size:clamp(5rem,22vw,18rem);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--t-text);text-shadow:0 8px 40px rgba(0,0,0,.45)}
.time.warn{color:var(--gold);animation:pulse 1s ease-in-out infinite}
.time.over{color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.breaknote{font-size:clamp(1rem,2.4vw,2.2rem);font-weight:900;letter-spacing:.2em;color:var(--gold)}

.blinds{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,4vw,4rem);flex-wrap:wrap}
.blk{text-align:center}
.blk .lab{font-size:clamp(.6rem,1vw,.9rem);letter-spacing:.25em;color:var(--dim);font-weight:700;text-transform:uppercase}
.blk .val{font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(1.8rem,5vw,4rem);color:var(--t-text);line-height:1;font-variant-numeric:tabular-nums}
.blk .val.small{font-size:clamp(1.2rem,3vw,2.4rem)}

/* ---- footer stats ---- */
.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.6rem,1.5vw,1.4rem);margin-top:1.4vh}
.card{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:clamp(.6rem,1.6vh,1.2rem) clamp(.8rem,1.5vw,1.4rem);backdrop-filter:blur(4px)}
.card .lab{font-size:clamp(.58rem,.9vw,.82rem);letter-spacing:.18em;color:var(--t-accent);font-weight:700;text-transform:uppercase;margin-bottom:.25rem}
.card .big{font-family:"Playfair Display",serif;font-weight:900;font-size:clamp(1.4rem,3.4vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
.card .sub{font-size:clamp(.6rem,1vw,.9rem);color:var(--dim);margin-top:.2rem}
.next .nx{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.prizes{font-size:clamp(.7rem,1.3vw,1.05rem);line-height:1.5}
.prizes .p{display:inline-block;margin-right:1rem;white-space:nowrap}
.prizes .p b{color:var(--t-accent);font-family:"Playfair Display",serif}
.itm{display:inline-block;margin-top:.3rem;font-size:clamp(.6rem,1vw,.82rem);font-weight:700;color:#86f0ad}
.itm.bubble{color:#ffd98a}

/* ---- gate overlay (audio unlock + clock pick) ---- */
#gate{position:fixed;inset:0;z-index:50;background:rgba(7,24,15,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:2rem}
#gate h1{font-family:"Playfair Display",serif;color:var(--gold);font-size:2rem}
#gate p{color:var(--dim);max-width:32rem}
#gate select{padding:.8rem 1rem;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream);font-size:1rem;font-family:inherit;min-width:18rem}
.startbtn{border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:1.2rem;padding:1rem 2.4rem;border-radius:999px;
  background:linear-gradient(145deg,var(--gold),var(--gold-d));color:var(--ink)}
.startbtn:active{transform:scale(.98)}
.err{color:#ffb4a8;font-size:.9rem}
@media (max-width:680px){ .foot{grid-template-columns:1fr;gap:.5rem} .blinds{gap:1.4rem} }
</style>
</head>
<body>
<div id="bg"></div><div id="bgveil"></div>

<div class="wrap" id="board" style="visibility:hidden">
  <div class="head">
    <div class="brand"><div class="mk">B</div><div><b>Bell Quads</b><small>POKER CLUB</small></div></div>
    <div style="display:flex;align-items:center;gap:1rem">
      <div class="tname" id="tname">—</div>
      <span class="statepill" id="state">idle</span>
    </div>
  </div>

  <div class="stage">
    <div class="lvlrow" id="lvlrow"><span class="lvltag">Level</span><span class="lvlnum" id="lvlnum">–</span></div>

    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="breaknote" id="breaknote" style="display:none"></div>
      <div class="blinds" id="blinds">
        <div class="blk"><div class="lab">Small</div><div class="val" id="sb">–</div></div>
        <div class="blk"><div class="lab">Big</div><div class="val" id="bb">–</div></div>
        <div class="blk"><div class="lab">Ante</div><div class="val small" id="ante">–</div></div>
      </div>
    </div>

    <div class="foot">
      <div class="card">
        <div class="lab">Players</div>
        <div class="big" id="players">– / –</div>
        <div class="sub" id="avg">Avg –</div>
      </div>
      <div class="card next">
        <div class="lab">Next Level</div>
        <div class="big nx" id="nextblind" style="font-size:clamp(1.1rem,2.6vw,2rem)">–</div>
        <div class="sub" id="nextmin"></div>
      </div>
      <div class="card">
        <div class="lab">Prize Pool</div>
        <div class="big" id="pool" style="font-size:clamp(1.2rem,2.8vw,2.2rem)">–</div>
        <div class="prizes" id="prizes"></div>
        <div class="itm" id="itm"></div>
      </div>
    </div>
  </div>
</div>

<div id="gate">
  <h1>Tournament Clock</h1>
  <p>表示するトーナメントを選び、開始してください。<br>（音を鳴らすため最初に1回タップが必要です）</p>
  <select id="gatePick"></select>
  <button class="startbtn" id="gateStart">▶ 表示を開始</button>
  <div class="err" id="gateErr"></div>
</div>

<script>
/* ===== Supabase ===== */
const SUPABASE_URL="https://dnnctulubrawypwgwgdo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_B54zNDjXmwfxfBLfhpBuBQ_ZVwFtN1M";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ===== 時刻オフセット（起動時に1回） ===== */
let clockOffset=0; // serverNow = Date.now()+clockOffset
async function syncServerTime(){
  try{
    const t0=Date.now();
    const {data}=await db.rpc("get_server_time");
    const t1=Date.now();
    if(data){ const srv=new Date(data).getTime(); clockOffset=srv-(t0+(t1-t0)/2); }
  }catch(e){ console.warn("time sync failed, using local clock",e); }
}
const serverNow=()=>Date.now()+clockOffset;

/* ===== 純関数: 状態導出 ===== */
function elapsedMs(c, now){
  if(!c||!c.started_at||c.status==="idle") return 0;
  let e = now - new Date(c.started_at).getTime() - (c.paused_accum_ms||0);
  if(c.status==="paused" && c.paused_at) e -= (now - new Date(c.paused_at).getTime());
  return Math.max(0,e);
}
function deriveLevel(levels, e){
  let acc=0;
  for(let i=0;i<levels.length;i++){
    const dur=(levels[i].min||0)*60000;
    if(e<acc+dur){ return {idx:i,lvl:levels[i],remainMs:acc+dur-e,next:levels[i+1]||null}; }
    acc+=dur;
  }
  const last=levels.length-1;
  return {idx:last, lvl:levels[last]||null, remainMs:0, next:null, finished:true};
}
function aggEntries(rows){
  let entries=0,bust=0,addon=0,poolIn=0;
  for(const r of rows){
    if(r.kind==="entry"||r.kind==="reentry"){ entries++; poolIn+=(r.pool_in||0); }
    else if(r.kind==="bust") bust++;
    else if(r.kind==="addon"){ addon+=(r.chips||0); poolIn+=(r.pool_in||0); } // 通常0
  }
  return {entries, remaining:Math.max(0,entries-bust), addonChips:addon, poolIn};
}
function prizeFor(tiers, entries){
  if(!Array.isArray(tiers)||!tiers.length) return null;
  let best=null;
  for(const t of tiers){ if(entries>=(t.min||0) && (!best||t.min>best.min)) best=t; }
  return best;
}
const fmtTime=ms=>{ms=Math.max(0,Math.round(ms/1000));const m=Math.floor(ms/60),s=ms%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const fmtNum=n=>Number(n||0).toLocaleString("ja-JP");

/* ===== ビープ（Web Audio・1分前用） ===== */
let actx=null;
function unlockAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==="suspended") actx.resume(); }
function beep(times=2){
  if(!actx) return;
  let t=actx.currentTime;
  for(let i=0;i<times;i++){
    const o=actx.createOscillator(),g=actx.createGain();
    o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    o.start(t); o.stop(t+0.36); t+=0.45;
  }
}
function chime(){ // レベル切替
  if(!actx) return; const t=actx.currentTime;
  [660,880,1175].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(actx.destination);const s=t+i*0.12;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.35,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.4);o.start(s);o.stop(s+0.42);});
}

/* ===== 状態 ===== */
let CLOCK=null, ENTRIES=[], rtClock=null, rtEntries=null;
let warnFired={}, lastIdx=null;

async function loadClock(id){
  const {data:c}=await db.from("tournament_clocks").select("*").eq("id",id).limit(1).single();
  CLOCK=c;
  const {data:e}=await db.from("tournament_entries").select("kind,chips,pool_in").eq("clock_id",id);
  ENTRIES=e||[];
}

function subscribe(id){
  if(rtClock) db.removeChannel(rtClock);
  if(rtEntries) db.removeChannel(rtEntries);
  rtClock=db.channel("clk_"+id)
    .on("postgres_changes",{event:"*",schema:"public",table:"tournament_clocks",filter:"id=eq."+id},
        async()=>{ await loadClock(id); render(); })
    .subscribe(st=>{ if(st==="SUBSCRIBED"){ loadClock(id).then(render); } }); // 再接続時に全体refetch
  rtEntries=db.channel("ent_"+id)
    .on("postgres_changes",{event:"*",schema:"public",table:"tournament_entries",filter:"clock_id=eq."+id},
        async()=>{ const {data:e}=await db.from("tournament_entries").select("kind,chips,pool_in").eq("clock_id",id); ENTRIES=e||[]; render(); })
    .subscribe();
}

/* ===== 描画 ===== */
function applyTheme(t){
  t=t||{};
  const root=document.documentElement.style;
  if(t.panel) root.setProperty("--t-panel",t.panel);
  if(t.accent) root.setProperty("--t-accent",t.accent);
  if(t.text)  root.setProperty("--t-text",t.text);
  if(typeof t.overlay==="number") root.setProperty("--t-overlay",t.overlay);
  const bg=document.getElementById("bg"), veil=document.getElementById("bgveil");
  if(t.bg_type==="image"&&t.bg_url){ bg.style.backgroundImage="url('"+t.bg_url+"')"; bg.style.display="block"; veil.style.display="block"; }
  else if(t.bg_type==="gradient"&&t.bg_from){ document.body.style.background="linear-gradient(160deg,"+t.bg_from+","+(t.bg_to||t.bg_from)+")"; bg.style.display="none"; veil.style.display="none"; }
  else if(t.bg_type==="color"&&t.bg_from){ document.body.style.background=t.bg_from; bg.style.display="none"; veil.style.display="none"; }
}

function render(){
  if(!CLOCK) return;
  const board=document.getElementById("board"); board.style.visibility="visible";
  applyTheme(CLOCK.theme);
  document.getElementById("tname").textContent=CLOCK.name||"トーナメント";
  const st=CLOCK.status||"idle";
  const pill=document.getElementById("state");
  pill.className="statepill "+(st==="running"?"running":st==="paused"?"paused":st==="finished"?"finished":"");
  pill.textContent={idle:"開始前",running:"進行中",paused:"一時停止",finished:"終了"}[st]||st;

  const levels=CLOCK.levels||[];
  const e=elapsedMs(CLOCK,serverNow());
  const D=deriveLevel(levels,e);
  const lvl=D.lvl||{};

  // レベル番号（休憩は番号付けない）
  let playNo=0; for(let i=0;i<=D.idx;i++){ if(!levels[i].is_break) playNo++; }
  document.getElementById("lvlnum").textContent = lvl.is_break? "BREAK" : (playNo||"–");

  // 残り時間 + 演出クラス
  const timeEl=document.getElementById("time");
  timeEl.textContent=fmtTime(D.remainMs);
  timeEl.classList.toggle("warn", !D.finished && D.remainMs<= (CLOCK.warn_seconds||60)*1000 && D.remainMs>0);
  timeEl.classList.toggle("over", D.finished && st!=="idle");

  // ブラインド表示 / 休憩表示
  const blindsEl=document.getElementById("blinds"), brk=document.getElementById("breaknote");
  if(lvl.is_break){
    blindsEl.style.display="none"; brk.style.display="block";
    brk.textContent=(lvl.label||"休憩");
  }else{
    blindsEl.style.display="flex"; brk.style.display="none";
    document.getElementById("sb").textContent=fmtNum(lvl.sb);
    document.getElementById("bb").textContent=fmtNum(lvl.bb);
    document.getElementById("ante").textContent=lvl.ante? fmtNum(lvl.ante):"–";
  }

  // 次レベル
  const nx=document.getElementById("nextblind"), nxm=document.getElementById("nextmin");
  if(D.next){
    if(D.next.is_break){ nx.textContent=D.next.label||"休憩"; }
    else nx.innerHTML=fmtNum(D.next.sb)+" / "+fmtNum(D.next.bb)+(D.next.ante?'<span class="sub" style="margin-left:.4rem">a'+fmtNum(D.next.ante)+'</span>':"");
    nxm.textContent=(D.next.min||0)+"分";
  }else{ nx.textContent="—"; nxm.textContent=""; }

  // 集計
  const ag=aggEntries(ENTRIES);
  const chips=ag.entries*(CLOCK.starting_stack||0)+ag.addonChips;
  const avg=ag.remaining>0? Math.round(chips/ag.remaining):0;
  const bb=lvl.bb||0;
  document.getElementById("players").textContent=ag.remaining+" / "+ag.entries;
  document.getElementById("avg").textContent="Avg "+fmtNum(avg)+(bb?(" ("+(Math.round(avg/bb))+"BB)"):"");

  // 賞金
  const pool=Math.floor(ag.poolIn*(CLOCK.prize_rate||0)/100);
  document.getElementById("pool").textContent="¥"+fmtNum(pool);
  const tier=prizeFor(CLOCK.prize_tiers, ag.entries);
  const pe=document.getElementById("prizes"), itm=document.getElementById("itm");
  if(tier&&Array.isArray(tier.splits)&&tier.splits.length){
    pe.innerHTML=tier.splits.map((s,i)=>'<span class="p">'+(i+1)+'位 <b>¥'+fmtNum(Math.floor(pool*s/100))+'</b></span>').join("");
    const paid=tier.splits.length;
    if(ag.remaining<=paid && ag.remaining>0){ itm.textContent="● IN THE MONEY"; itm.className="itm"; }
    else if(ag.remaining===paid+1){ itm.textContent="● バブル（あと1人で入賞）"; itm.className="itm bubble"; }
    else { itm.textContent="入賞 "+paid+"人"; itm.className="itm"; }
  }else{ pe.innerHTML=""; itm.textContent=""; }

  // ---- 音（1分前 / レベル切替）----
  if(D.idx!==lastIdx){
    if(lastIdx!==null && st==="running") chime();   // 実際にレベルが進んだ
    lastIdx=D.idx; warnFired={};
  }
  const warnMs=(CLOCK.warn_seconds||60)*1000;
  if(st==="running" && !D.finished && !lvl.is_break && D.remainMs<=warnMs && D.remainMs>0 && !warnFired[D.idx]){
    warnFired[D.idx]=true; beep(2);
  }
}

/* ===== ループ ===== */
function tick(){ render(); }
setInterval(tick,250);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && CLOCK){ loadClock(CLOCK.id).then(render); } });

/* ===== ゲート（音解錠 + クロック選択） ===== */
async function initGate(){
  await syncServerTime();
  const sel=document.getElementById("gatePick");
  const {data}=await db.from("tournament_clocks").select("id,name,status").order("updated_at",{ascending:false});
  const list=data||[];
  if(!list.length){ document.getElementById("gateErr").textContent="トーナメントがありません。スタッフ画面で作成してください。"; }
  sel.innerHTML=list.map(c=>'<option value="'+c.id+'">'+(c.name||"無題")+'（'+c.status+'）</option>').join("");
  // URL ?id= 指定があれば優先
  const q=new URLSearchParams(location.search).get("id");
  if(q && list.find(c=>c.id===q)) sel.value=q;
}
document.getElementById("gateStart").addEventListener("click",async()=>{
  unlockAudio();
  const id=document.getElementById("gatePick").value;
  if(!id){ document.getElementById("gateErr").textContent="選択してください"; return; }
  await loadClock(id); subscribe(id); render();
  document.getElementById("gate").style.display="none";
});
initGate();
</script>
</body>
</html>
