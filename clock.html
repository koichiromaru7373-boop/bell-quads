*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  color:var(--t-text);background:var(--t-bg);min-height:100dvh;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
#bgveil{position:fixed;inset:0;z-index:1;background:rgba(8,40,36,var(--t-overlay));display:none}

.screen{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column}
.titlebar{position:relative;flex:0 0 auto;text-align:center;font-weight:700;letter-spacing:.03em;color:var(--t-val);
  font-size:clamp(1rem,2.6vw,2rem);padding:clamp(.45rem,1.5vh,1rem) 3.5rem;border-bottom:1px solid var(--t-line)}
.tb-logo{position:absolute;left:clamp(.6rem,1.6vw,1.4rem);top:50%;transform:translateY(-50%);
  width:clamp(34px,4.4vh,58px);aspect-ratio:1;background:var(--logo) center/contain no-repeat}
.body{flex:1;display:grid;grid-template-columns:clamp(170px,23vw,290px) 1fr;min-height:0}

.side{border-right:1px solid var(--t-line);padding:clamp(.6rem,1.8vh,1.4rem) clamp(.7rem,1.6vw,1.4rem);
  display:flex;flex-direction:column;gap:clamp(.4rem,1.4vh,1rem);overflow:hidden}
.side .sec{display:flex;flex-direction:column;gap:.15rem}
.side .sep{height:1px;background:var(--t-line)}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.prow .k{font-size:clamp(.62rem,1.1vw,.95rem);color:var(--t-lab);font-weight:500;white-space:nowrap}
.prow .v{font-size:clamp(.85rem,1.5vw,1.35rem);color:var(--t-val);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .v.big{font-size:clamp(1rem,1.9vw,1.7rem)}
.breakbox{margin-top:auto;display:flex;align-items:center;gap:.5rem;color:var(--t-lab)}
.breakbox .ic{width:clamp(20px,2.4vw,30px);aspect-ratio:1;border:2px solid var(--t-val);border-radius:50%;display:grid;place-items:center;font-size:.7rem;flex:0 0 auto;color:var(--t-val)}
.breakbox .bt{line-height:1.15}
.breakbox .bt b{display:block;color:var(--t-text);font-size:clamp(.85rem,1.5vw,1.25rem);font-weight:700}
.breakbox .bt span{font-size:clamp(.58rem,1vw,.8rem)}

.main{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(.4rem,2vh,1.6rem) clamp(1rem,3vw,3rem);min-height:0;position:relative;overflow:hidden}
.wm{position:absolute;inset:0;background:var(--logo) center/min(58vh,70%) no-repeat;opacity:.07;pointer-events:none;z-index:0}
.main>*:not(.wm){position:relative;z-index:1}
.time{font-weight:900;line-height:.92;font-size:clamp(4rem,17vw,12rem);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;text-shadow:0 3px 16px rgba(0,0,0,.45)}
.time.warn{color:var(--t-val);animation:blink 1s steps(1,end) infinite}
.time.over{opacity:.85}
@keyframes blink{50%{opacity:.4}}
.lvl{margin-top:.3rem;font-size:clamp(1rem,2.6vw,2.1rem);font-weight:700;color:var(--t-val);opacity:.95}
.blinds{margin-top:.4rem;font-weight:900;font-size:clamp(2.4rem,9vw,6.4rem);line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 3px 16px rgba(0,0,0,.45);text-align:center}
.ante{margin-top:.1rem;font-size:clamp(.8rem,1.7vw,1.3rem);font-weight:500;color:var(--t-lab)}

.pn{margin-top:auto;width:100%;display:flex;justify-content:space-around;gap:1rem;padding-top:clamp(.4rem,1.6vh,1.2rem)}
.pn .col{text-align:center;flex:1}
.pn .lab{font-size:clamp(.72rem,1.5vw,1.2rem);font-weight:500;color:var(--t-lab);margin-bottom:.15rem}
.pn .val{font-weight:700;font-size:clamp(1.3rem,4.4vw,3rem);line-height:1.05;font-variant-numeric:tabular-nums}
.pn .sub{font-size:clamp(.8rem,1.9vw,1.4rem);font-weight:700;color:var(--t-val)}

#gate{position:fixed;inset:0;z-index:50;background:#0d3a1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:2rem}
#gate .glogo{width:clamp(90px,16vh,150px);aspect-ratio:1;background:var(--logo) center/contain no-repeat}
#gate h1{font-size:1.6rem;font-weight:700;color:var(--t-val)}
#gate p{color:var(--t-lab);max-width:34rem}
#gate select{padding:.8rem 1rem;border-radius:10px;border:1px solid var(--t-line);background:rgba(0,0,0,.25);color:#fff;font-size:1rem;font-family:inherit;min-width:18rem}
.startbtn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:1.15rem;padding:1rem 2.4rem;border-radius:999px;background:var(--t-val);color:#0d3a1f}
.startbtn:active{transform:scale(.98)}
.err{color:#ffd0c8;font-size:.9rem}
@media (orientation:portrait){
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:none;border-bottom:1px solid var(--t-line);flex-direction:row;flex-wrap:wrap;gap:.6rem 1.4rem}
  .side .sep,.breakbox{display:none}
}

</style>
</head>
<body>
<div id="bg"></div><div id="bgveil"></div>

<div class="screen" id="board" style="visibility:hidden">
  <div class="titlebar"><div class="tb-logo"></div><span id="tname">—</span></div>
  <div class="body">
    <aside class="side">
      <div class="sec" id="prizeList"></div>
      <div class="sep"></div>
      <div class="sec">
        <div class="prow"><span class="k">プール</span><span class="v big" id="pool">¥0</span></div>
        <div class="prow"><span class="k">エントリー</span><span class="v" id="entries">0</span></div>
        <div class="prow"><span class="k">リエントリー</span><span class="v" id="rebuys">0</span></div>
      </div>
      <div class="sep"></div>
      <div class="sec">
        <div class="prow"><span class="k">残り人数</span><span class="v" id="players">0 / 0</span></div>
        <div class="prow"><span class="k">平均スタック</span><span class="v" id="avg">0</span></div>
      </div>
      <div class="breakbox">
        <div class="ic">&#9201;</div>
        <div class="bt"><b id="nbreak">&mdash;</b><span>次の休憩まで</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="wm"></div>
      <div class="time" id="time">--:--</div>
      <div class="lvl" id="lvl">Level &ndash;</div>
      <div class="blinds" id="blinds">&ndash; / &ndash;</div>
      <div class="ante" id="ante"></div>
      <div class="pn">
        <div class="col"><div class="lab">前のレベル</div><div class="val" id="prev">&ndash;</div></div>
        <div class="col"><div class="lab">次</div><div class="val" id="nextv">&ndash;</div><div class="sub" id="nextsub"></div></div>
      </div>
    </main>
  </div>
</div>

<div id="gate">
  <div class="glogo"></div>
  <h1>Tournament Clock</h1>
  <p>表示するトーナメントを選び、開始してください。<br>（音を鳴らすため最初に1回タップが必要です）</p>
  <select id="gatePick"></select>
  <button class="startbtn" id="gateStart">&#9654; 表示を開始</button>
  <div class="err" id="gateErr"></div>
</div>
<script>

/* ===== Supabase ===== */
const SUPABASE_URL="https://dnnctulubrawypwgwgdo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_B54zNDjXmwfxfBLfhpBuBQ_ZVwFtN1M";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let clockOffset=0;
async function syncServerTime(){
  try{const t0=Date.now();const {data}=await db.rpc("get_server_time");const t1=Date.now();
    if(data){clockOffset=new Date(data).getTime()-(t0+(t1-t0)/2);}}catch(e){console.warn(e);}
}
const serverNow=()=>Date.now()+clockOffset;

function elapsedMs(c,now){if(!c||!c.started_at||c.status==="idle")return 0;
  let e=now-new Date(c.started_at).getTime()-(c.paused_accum_ms||0);
  if(c.status==="paused"&&c.paused_at)e-=(now-new Date(c.paused_at).getTime());return Math.max(0,e);}
function deriveLevel(levels,e){let acc=0;for(let i=0;i<levels.length;i++){const d=(levels[i].min||0)*60000;
  if(e<acc+d)return{idx:i,lvl:levels[i],remainMs:acc+d-e,next:levels[i+1]||null};acc+=d;}
  const l=levels.length-1;return{idx:l,lvl:levels[l]||null,remainMs:0,next:null,finished:true};}
function aggEntries(rows){let entries=0,reentry=0,bust=0,addon=0,poolIn=0;for(const r of rows){
  if(r.kind==="entry"||r.kind==="reentry"){entries++;poolIn+=(r.pool_in||0);if(r.kind==="reentry")reentry++;}
  else if(r.kind==="bust")bust++;else if(r.kind==="addon"){addon+=(r.chips||0);poolIn+=(r.pool_in||0);}}
  return{entries,reentry,remaining:Math.max(0,entries-bust),addonChips:addon,poolIn};}
function prizeFor(tiers,entries){if(!Array.isArray(tiers)||!tiers.length)return null;let best=null;
  for(const t of tiers){if(entries>=(t.min||0)&&(!best||t.min>best.min))best=t;}return best;}
function nextBreakMs(levels,idx,remainMs){if(!levels[idx]||levels[idx].is_break)return null;
  let ms=remainMs;for(let i=idx+1;i<levels.length;i++){if(levels[i].is_break)return ms;ms+=(levels[i].min||0)*60000;}return null;}
function prevPlay(levels,idx){for(let i=idx-1;i>=0;i--)if(!levels[i].is_break)return levels[i];return null;}
function nextPlayAfter(levels,from){for(let i=from;i<levels.length;i++)if(!levels[i].is_break)return levels[i];return null;}
const fmtTime=ms=>{ms=Math.max(0,Math.round(ms/1000));return String(Math.floor(ms/60)).padStart(2,"0")+":"+String(ms%60).padStart(2,"0");};
const fmtNum=n=>Number(n||0).toLocaleString("ja-JP");
const blindStr=l=>fmtNum(l.sb)+" / "+fmtNum(l.bb);
const ord=i=>(i+1)+"位";

let actx=null;
function unlockAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==="suspended")actx.resume();}
function beep(times=2){if(!actx)return;let t=actx.currentTime;for(let i=0;i<times;i++){const o=actx.createOscillator(),g=actx.createGain();
  o.type="sine";o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
  o.start(t);o.stop(t+.36);t+=.45;}}
function chime(){if(!actx)return;const t=actx.currentTime;[660,880,1175].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(actx.destination);const s=t+i*.12;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.4);
  o.start(s);o.stop(s+.42);});}

let CLOCK=null,ENTRIES=[],rtClock=null,rtEntries=null,warnFired={},lastIdx=null;
async function loadClock(id){
  const {data:c}=await db.from("tournament_clocks").select("*").eq("id",id).limit(1).single();CLOCK=c;
  const {data:e}=await db.from("tournament_entries").select("kind,chips,pool_in").eq("clock_id",id);ENTRIES=e||[];}
function subscribe(id){
  if(rtClock)db.removeChannel(rtClock);if(rtEntries)db.removeChannel(rtEntries);
  rtClock=db.channel("clk_"+id).on("postgres_changes",{event:"*",schema:"public",table:"tournament_clocks",filter:"id=eq."+id},
    async()=>{await loadClock(id);render();}).subscribe(st=>{if(st==="SUBSCRIBED")loadClock(id).then(render);});
  rtEntries=db.channel("ent_"+id).on("postgres_changes",{event:"*",schema:"public",table:"tournament_entries",filter:"clock_id=eq."+id},
    async()=>{const {data:e}=await db.from("tournament_entries").select("kind,chips,pool_in").eq("clock_id",id);ENTRIES=e||[];render();}).subscribe();}

function applyTheme(t){t=t||{};const r=document.documentElement.style;
  if(t.text)r.setProperty("--t-text",t.text);
  if(t.accent)r.setProperty("--t-val",t.accent);
  if(typeof t.overlay==="number")r.setProperty("--t-overlay",t.overlay);
  const bg=document.getElementById("bg"),veil=document.getElementById("bgveil");
  if(t.bg_type==="image"&&t.bg_url){bg.style.backgroundImage="url('"+t.bg_url+"')";bg.style.display="block";veil.style.display="block";}
  else if(t.bg_type==="gradient"&&t.bg_from){document.body.style.background="linear-gradient(160deg,"+t.bg_from+","+(t.bg_to||t.bg_from)+")";bg.style.display="none";veil.style.display="none";}
  else if(t.bg_type==="color"&&t.bg_from){document.body.style.background=t.bg_from;r.setProperty("--t-bg",t.bg_from);bg.style.display="none";veil.style.display="none";}
}

function render(){
  if(!CLOCK)return;
  document.getElementById("board").style.visibility="visible";
  applyTheme(CLOCK.theme);
  document.getElementById("tname").textContent=CLOCK.name||"Tournament";

  const levels=CLOCK.levels||[];
  const st=CLOCK.status||"idle";
  const D=deriveLevel(levels,elapsedMs(CLOCK,serverNow()));const lvl=D.lvl||{};
  let playNo=0;for(let i=0;i<=D.idx;i++){if(!levels[i].is_break)playNo++;}

  const timeEl=document.getElementById("time");
  timeEl.textContent=fmtTime(D.remainMs);
  timeEl.classList.toggle("warn",!D.finished&&st==="running"&&D.remainMs<=(CLOCK.warn_seconds||60)*1000&&D.remainMs>0);
  timeEl.classList.toggle("over",D.finished);

  const lblEl=document.getElementById("lvl"),blEl=document.getElementById("blinds"),anEl=document.getElementById("ante");
  if(lvl.is_break){lblEl.textContent="休憩";blEl.textContent=(lvl.label&&lvl.label!=="休憩")?lvl.label:"BREAK";anEl.textContent="";}
  else{lblEl.textContent="Level "+(playNo||"–");blEl.textContent=blindStr(lvl);anEl.textContent=lvl.ante?("ante "+fmtNum(lvl.ante)):"";}

  const pv=prevPlay(levels,D.idx);
  document.getElementById("prev").textContent=pv?blindStr(pv):"–";
  const nv=document.getElementById("nextv"),ns=document.getElementById("nextsub");
  if(D.next){
    if(D.next.is_break){nv.textContent="BREAK";const np=nextPlayAfter(levels,D.idx+2);ns.textContent=np?blindStr(np):"";}
    else{nv.textContent=blindStr(D.next);ns.textContent=D.next.ante?("ante "+fmtNum(D.next.ante)):"";}
  }else{nv.textContent="—";ns.textContent="";}

  const ag=aggEntries(ENTRIES);
  const chips=ag.entries*(CLOCK.starting_stack||0)+ag.addonChips;
  const avg=ag.remaining>0?Math.round(chips/ag.remaining):0;
  document.getElementById("entries").textContent=ag.entries;
  document.getElementById("rebuys").textContent=ag.reentry;
  document.getElementById("players").textContent=ag.remaining+" / "+ag.entries;
  document.getElementById("avg").textContent=fmtNum(avg)+(lvl.bb?(" ("+Math.round(avg/lvl.bb)+"BB)"):"");

  const pool=Math.floor(ag.poolIn*(CLOCK.prize_rate||0)/100);
  document.getElementById("pool").textContent="¥"+fmtNum(pool);
  const tier=prizeFor(CLOCK.prize_tiers,ag.entries),pl=document.getElementById("prizeList");
  if(tier&&Array.isArray(tier.splits)&&tier.splits.length){
    pl.innerHTML=tier.splits.map((s,i)=>'<div class="prow"><span class="k">'+ord(i)+'</span><span class="v">¥'+fmtNum(Math.floor(pool*s/100))+'</span></div>').join("");
  }else pl.innerHTML='<div class="prow"><span class="k">賞金</span><span class="v">—</span></div>';

  const nb=nextBreakMs(levels,D.idx,D.remainMs);
  document.getElementById("nbreak").textContent = nb==null ? "—" : (nb<60000? "まもなく" : ("あと "+Math.ceil(nb/60000)+"分"));

  if(D.idx!==lastIdx){if(lastIdx!==null&&st==="running")chime();lastIdx=D.idx;warnFired={};}
  const w=(CLOCK.warn_seconds||60)*1000;
  if(st==="running"&&!D.finished&&!lvl.is_break&&D.remainMs<=w&&D.remainMs>0&&!warnFired[D.idx]){warnFired[D.idx]=true;beep(2);}
}

setInterval(render,250);
/* Realtime取りこぼし対策：4秒ごとに状態を取り直して自己修復（停止/再開/人数が必ず追従する） */
setInterval(()=>{ if(CLOCK) loadClock(CLOCK.id).then(render).catch(()=>{}); },4000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CLOCK)loadClock(CLOCK.id).then(render);});

async function initGate(){
  await syncServerTime();
  const sel=document.getElementById("gatePick");
  const {data}=await db.from("tournament_clocks").select("id,name,status").order("updated_at",{ascending:false});
  const list=data||[];
  if(!list.length)document.getElementById("gateErr").textContent="トーナメントがありません。スタッフ画面で作成してください。";
  sel.innerHTML=list.map(c=>'<option value="'+c.id+'">'+(c.name||"無題")+'（'+c.status+'）</option>').join("");
  const q=new URLSearchParams(location.search).get("id");
  if(q&&list.find(c=>c.id===q))sel.value=q;
}
document.getElementById("gateStart").addEventListener("click",async()=>{
  unlockAudio();const id=document.getElementById("gatePick").value;
  if(!id){document.getElementById("gateErr").textContent="選択してください";return;}
  await loadClock(id);subscribe(id);render();document.getElementById("gate").style.display="none";
});
initGate();

</script>
</body>
</html>
